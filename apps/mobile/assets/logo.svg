<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <!--
    The PrepPilot mark: a progress ring around a checkmark — the two shapes the
    product is about, a ring that fills and a topic that gets ticked.

    THIS FILE IS THE LOGO. Replace it to rebrand the app: it drives the in-app
    branding directly, and `pnpm logo:build` regenerates the Android launcher
    icon and splash image from it. Keep the viewBox square.

    Plain colours on purpose: react-native-svg does not understand CSS
    variables, so anything themed here would render as nothing in the app.
  -->
  <circle cx="48" cy="48" r="44.1600"
          fill="none" stroke="#1E2A38" stroke-width="7.6800"/>
  <circle cx="48" cy="48" r="44.1600"
          fill="none" stroke="#3B82F6" stroke-width="7.6800"
          stroke-linecap="round"
          stroke-dasharray="277.4655" stroke-dashoffset="88.7889"
          transform="rotate(-90 48 48)"/>
  <path d="M31.68 48 L43.2 59.52 L65.28 37.44"
        fill="none" stroke="#F8FAFC" stroke-width="6.9120"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
